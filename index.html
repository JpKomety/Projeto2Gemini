<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Segurança Digital</title>
    <style>
        /* Cole todo o código CSS aqui dentro */
        :root {
            --cor-fundo: #EEF2F7;
            --cor-cartao: #FFFFFF;
            --cor-texto: #1A1A1A;
            --cor-primaria: #004687;
            --cor-alerta: #D9381E;
            --cor-sucesso: #1E7E34;
            --sombra-card: 0 8px 16px rgba(0, 0, 0, 0.08);
            --sombra-hover: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 22px;
            line-height: 1.6;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .barramenu-acessibilidade {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .botao-acessibilidade {
            background-color: var(--cor-cartao);
            color: var(--cor-primaria);
            border: 2px solid var(--cor-primaria);
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        .botao-acessibilidade:hover, .botao-acessibilidade:focus {
            background-color: var(--cor-primaria);
            color: white;
            transform: translateY(-2px);
            outline: 3px solid #FFD700;
        }

        header {
            text-align: center;
            background: linear-gradient(135deg, #004687, #002B54);
            color: white;
            padding: 40px 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: var(--sombra-card);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        p.subtitulo {
            font-size: 24px;
            font-weight: 500;
            opacity: 0.95;
        }

        .botao-emergencia {
            display: block;
            background: linear-gradient(135deg, #D9381E, #A61C05);
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(217, 56, 30, 0.3);
            border: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .botao-emergencia:hover, .botao-emergencia:focus {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(217, 56, 30, 0.4);
            outline: 4px solid #FFD700;
            cursor: pointer;
        }

        nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .botao-menu {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--cor-cartao);
            color: var(--cor-primaria);
            border: 3px solid var(--cor-primaria);
            padding: 25px 20px;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--sombra-card);
            transition: all 0.2s ease;
            min-height: 100px;
        }

        .botao-menu:hover, .botao-menu:focus {
            background-color: var(--cor-primaria);
            color: white;
            transform: translateY(-4px);
            box-shadow: var(--sombra-hover);
            outline: 4px solid #FFD700;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .secao-dica {
            background-color: var(--cor-cartao);
            border-top: 8px solid var(--cor-primaria);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--sombra-card);
            transition: transform 0.2s ease;
            scroll-margin-top: 20px;
        }

        .secao-dica:hover {
            transform: translateY(-2px);
            box-shadow: var(--sombra-hover);
        }

        .secao-dica.alerta {
            border-top-color: var(--cor-alerta);
        }

        .secao-dica.sucesso {
            border-top-color: var(--cor-sucesso);
        }

        h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #000000;
        }

        ul {
            margin-left: 25px;
            margin-top: 15px;
        }

        li {
            margin-bottom: 15px;
        }

        code {
            background-color: #E9ECEF;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 20px;
        }

        .modal-ajuda {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-conteudo {
            background-color: white;
            margin: 10% auto;
            padding: 35px;
            border-radius: 20px;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal-acoes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .botao-confirmar-ligacao {
            background-color: var(--cor-alerta);
            color: white;
            padding: 18px;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(217, 56, 30, 0.3);
        }

        .botao-fechar {
            background-color: #555555;
            color: white;
            border: none;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px 20px;
            font-size: 18px;
            border-top: 2px solid #D0D7DE;
        }

        .botao-topo {
            display: inline-block;
            margin-top: 20px;
            background-color: #333333;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- Seu conteúdo do body continua o mesmo -->
</body>
</html>
